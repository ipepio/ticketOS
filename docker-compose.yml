# ticketOS — Docker Compose reference deployment

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketos
      POSTGRES_PASSWORD: ticketos
      POSTGRES_DB: ticketos
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./storage/attachments:/var/lib/attachments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketos -d ticketos"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketos
      POSTGRES_PASSWORD: ticketos
      POSTGRES_DB: ticketos_e2e
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketos -d ticketos_e2e"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ticketos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ticketos-dev-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://ticketos:ticketos@postgres:5432/ticketos
      # F9/S2: the local-volume adapter is the Docker default and uses the
      # existing Attachment volume below. To run Docker against MinIO instead,
      # replace these two lines with the S3 block that follows them.
      ATTACHMENT_STORAGE_ADAPTER: local
      ATTACHMENT_LOCAL_DIR: /var/lib/attachments
      # ATTACHMENT_STORAGE_ADAPTER: s3
      # ATTACHMENT_S3_BUCKET: ticketos-attachments
      # ATTACHMENT_S3_REGION: us-east-1
      # ATTACHMENT_S3_ENDPOINT: http://minio:9000
      # ATTACHMENT_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ticketos}
      # ATTACHMENT_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-...}
      # ATTACHMENT_S3_FORCE_PATH_STYLE: "true"
      # An incomplete S3 configuration aborts startup; it is never local mode.
      # Switching to S3 also wants a `minio` service_healthy dependency.
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-32-chars}
      REPLY_TOKEN_SECRET: ${SESSION_SECRET:-change-me-in-production-32-chars}
      SMTP_HOST: smtp
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      HOST: 0.0.0.0
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5176}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5176}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3020:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/attachments:/var/lib/attachments

  app-e2e:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: >-
        postgresql://ticketos:ticketos@postgres-e2e:5432/ticketos_e2e
      ATTACHMENT_STORAGE_ADAPTER: local
      ATTACHMENT_LOCAL_DIR: /tmp/ticketos-e2e-attachments
      SESSION_SECRET: e2e-session-secret-with-at-least-32-characters
      REPLY_TOKEN_SECRET: e2e-reply-secret-with-at-least-32-characters
      SMTP_HOST: smtp
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_APP_URL: http://localhost:3021
      CORS_ORIGIN: http://localhost:3021
      LOG_LEVEL: info
    ports:
      - "3021:3000"
    depends_on:
      postgres-e2e:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node packages/worker/dist/index.js
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://ticketos:ticketos@postgres:5432/ticketos
      ATTACHMENT_STORAGE_ADAPTER: local
      ATTACHMENT_LOCAL_DIR: /var/lib/attachments
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-32-chars}
      REPLY_TOKEN_SECRET: ${SESSION_SECRET:-change-me-in-production-32-chars}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/attachments:/var/lib/attachments

  smtp:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
