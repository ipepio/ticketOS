name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  architecture-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:arch
      # S2: deliberately violating each boundary must fail.
      - name: Run negative architecture fixtures
        run: >-
          pnpm --filter @ticketos/app exec vitest run
          --root ../..
          --globals scripts/check-architecture.test.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticketos
          POSTGRES_PASSWORD: ticketos
          POSTGRES_DB: ticketos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ticketos/app test
        env:
          DATABASE_URL: postgresql://ticketos:ticketos@localhost:5432/ticketos

  e2e-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticketos
          POSTGRES_PASSWORD: ticketos
          POSTGRES_DB: ticketos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      - name: Run app server
        run: |
          DATABASE_URL=postgresql://ticketos:ticketos@localhost:5432/ticketos \
          SESSION_SECRET=ci-test-session-secret-min-32-chars-long! \
          REPLY_TOKEN_SECRET=ci-test-reply-token-secret-min-32-chars! \
          pnpm --filter @ticketos/app node dist/index.js &
          npx wait-on http://localhost:3000/health --timeout 30000
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://ticketos:ticketos@localhost:5432/ticketos
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-test, e2e-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ticketos:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
