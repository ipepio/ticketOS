# Development overrides — not for production

services:
  app:
    volumes:
      - ./packages/app/src:/app/packages/app/src
    environment:
      LOG_LEVEL: info

  # Host access to the development SeaweedFS S3 gateway: API on 9100.
  seaweedfs:
    ports:
      - "9100:8333"

  worker:
    volumes:
      - ./packages/worker/src:/app/packages/worker/src
    environment:
      LOG_LEVEL: info
